  "/item-stock":
    post:
      tags:
        - "Catalog and stock (push)"
      operationId: "pushStock"
      summary: "Push warehouses and stock with cost"
      description: "Ability `stock:write`. `as_of` is the moment the balances were taken; an older `as_of` never overwrites a newer row. `cost` is the total cost of `quantity` (preferred) or `unit_cost` per unit, in `cost_currency` (default UZS). Negative balances are accepted."
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Timestamp"
        - "$ref": "#/components/parameters/Signature"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/StockBatch"
            examples:
              full_snapshot_part:
                value:
                  batch_id: "5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a"
                  mode: "full"
                  sent_at: "2026-10-19T06:00:00+05:00"
                  snapshot:
                    id: "9e8d7c6b-5a49-4382-a716-f5e4d3c2b1a0"
                    part: 1
                    total_parts: 3
                  as_of: "2026-10-19T06:00:00+05:00"
                  warehouses:
