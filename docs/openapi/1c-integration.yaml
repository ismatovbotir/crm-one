                      warehouse_id: "3c4d5e6f-0000-4000-8000-000000000001"
                      quantity: "120.500"
                      unit_cost: "1.85"
                      cost_currency: "USD"
      responses:
        "202":
          "$ref": "#/components/responses/BatchAccepted"
        "207":
          "$ref": "#/components/responses/BatchPartlyAccepted"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "413":
          "$ref": "#/components/responses/PayloadTooLarge"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/IntegrationDisabled"
  "/batch":
    post:
      tags:
        - "Catalog and stock (push)"
      operationId: "pushCombined"
      summary: "Push catalog and stock in one request"
      description: "The token needs the ability of every section present (`items:write` for `items`, `stock:write` for `stock`)."
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Timestamp"
        - "$ref": "#/components/parameters/Signature"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CombinedBatch"
            examples:
              combined:
                value:
                  batch_id: "4c3b2a19-0f1e-4d2c-8b3a-5f6e7d8c9b0a"
                  mode: "delta"
                  sent_at: "2026-10-19T09:30:00+05:00"
                  items:
                    units:
                      - id: "1a2b3c4d-0000-4000-8000-000000000796"
                        code: "796"
                        name: "шт"
                        is_deleted: false
                        updated_at: "2026-10-01T10:00:00+05:00"
                    groups:
