                            number: "OR-2026-00031"
                            external_id: "e4f5a6b7-c8d9-4e0f-9102-3c4d5e6f7081"
                          customer:
                            crm_id: "c7a1e2d3-4b5c-4d6e-8f70-81a2b3c4d5e6"
