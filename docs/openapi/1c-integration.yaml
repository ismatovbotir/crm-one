  "/outbox/ack":
    post:
      tags:
        - "Document outbox (pull)"
      operationId: "ackOutbox"
      summary: "Acknowledge pulled documents"
      description: "`{\"acks\": [...]}` (1–500); each ack needs the read ability of its event feed. `applied`/`already_applied`/`superseded` store the 1C GUID and number; `rejected` marks the document as rejected by 1C with your `errors`. Later `posting_status` changes (posted / unposted / deleted) may be re-sent for the same event; the newest `updated_at` wins."
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Timestamp"
        - "$ref": "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OutboxAcks"
            examples:
              acks:
                value:
                  acks:
                    - event_id: "b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e"
                      result: "applied"
                      onec_guid: "f5a6b7c8-d9e0-4f10-a213-4d5e6f708192"
                      onec_number: "ЦБ-00000881"
                      posting_status: "posted"
                      updated_at: "2026-10-19T11:06:00+05:00"
                    - event_id: "a0b1c2d3-e4f5-4a6b-9c7d-8e9f0a1b2c3d"
                      result: "rejected"
                      errors:
                        - code: "item_not_found"
                          message: "Номенклатура не найдена"
      responses:
        "200":
          description: "All applied"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AckResults"
        "207":
          description: "Some acknowledgements rejected"
