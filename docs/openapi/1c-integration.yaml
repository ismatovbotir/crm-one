        "503":
          "$ref": "#/components/responses/IntegrationDisabled"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "1c_<48 random characters>"
      description: "Integration token issued in CRM Settings > Integrations (shown once). Scoped by abilities, optional IP allowlist, expiry (default 180 days, max 365). Send `Authorization: Bearer 1c_...`."
  parameters:
    RequestId:
      name: "X-Request-Id"
      in: "header"
      required: false
      schema:
        type: "string"
        format: "uuid"
      description: "Correlation id (UUID) echoed as `request_id`."
    Timestamp:
      name: "X-Timestamp"
      in: "header"
      required: false
      schema:
        type: "string"
        pattern: "^\\d+$"
      description: "Unix time in seconds; required when the request must be signed. Tolerance ±300 s."
    Signature:
      name: "X-Signature"
      in: "header"
      required: false
      schema:
        type: "string"
        pattern: "^sha256=[0-9a-f]{64}$"
      description: "`sha256=` + hex HMAC-SHA256 of `X-Timestamp + \".\" + raw body` with the token signing secret."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        format: "uuid"
      description: "Optional; must equal `batch_id`."
  headers:
    RetryAfter:
      description: "Seconds to wait before retrying (429, 503)."
      schema:
        type: "integer"
    IdempotentReplayed:
      description: "`true` when the response is the stored answer to an earlier request with the same batch_id and body."
      schema:
        type: "string"
        enum:
          - "true"
  responses:
    BatchAccepted:
      description: "Accepted for processing (all records valid)."
      headers:
        Idempotent-Replayed:
          "$ref": "#/components/headers/IdempotentReplayed"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/BatchAccepted"
          example:
            batch_id: "0b6f6a4e-2c1d-4f3a-9e8b-7d6c5b4a3f21"
            status: "queued"
            received:
              units: 1
              groups: 1
              items: 2
            accepted: 4
            rejected: []
            status_url: "/api/v1/integration/1c/batches/0b6f6a4e-2c1d-4f3a-9e8b-7d6c5b4a3f21"
            request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    BatchPartlyAccepted:
      description: "Accepted for processing; some records were rejected (listed in `rejected`)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/BatchAccepted"
          example:
            batch_id: "0b6f6a4e-2c1d-4f3a-9e8b-7d6c5b4a3f21"
            status: "queued"
            received:
              units: 1
              groups: 1
              items: 2
            accepted: 3
            rejected:
              - section: "items"
                index: 1
                id: "6b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d"
                errors:
                  - field: "unit_id"
                    code: "required"
                    message: "The unit_id field is required."
            status_url: "/api/v1/integration/1c/batches/0b6f6a4e-2c1d-4f3a-9e8b-7d6c5b4a3f21"
            request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    Unauthenticated:
      description: "Missing, invalid, expired token; or missing/invalid signature."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "unauthenticated"
              message: "Invalid or missing API token."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    Forbidden:
      description: "Token lacks the ability, IP not allowed, or HTTPS required."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "forbidden_ability"
              message: "This token lacks the [items:write] ability."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    NotFound:
      description: "Not found (or not visible to this token)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "not_found"
              message: "Batch not found."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    Conflict:
      description: "batch_id reused with another body, or snapshot parts disagree."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "idempotency_key_reused"
              message: "This batch_id was already used with a different body."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    PayloadTooLarge:
      description: "Body over the limit (10 MB by default): split the batch."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "payload_too_large"
              message: "The request body exceeds the limit; split the batch."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    UnsupportedMediaType:
      description: "Content-Type must be application/json."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "unsupported_media_type"
              message: "Send Content-Type: application/json; charset=utf-8."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    ValidationFailed:
      description: "Envelope invalid, every record invalid, or bad paging parameters. `fields` lists the problems; for all-invalid batches `rejected` lists the records."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "validation_failed"
              message: "The batch envelope is invalid."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    RateLimited:
      description: "Too many requests."
      headers:
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "rate_limited"
              message: "Too many requests; retry the same batch_id after Retry-After seconds."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
    IntegrationDisabled:
      description: "The integration (or the customer exchange) is switched off in the CRM."
      headers:
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            error:
              code: "integration_disabled"
              message: "The 1C integration is disabled in the CRM."
              request_id: "3f2b8c1e-6a4d-4e0f-9b7a-2c5d8e1f4a6b"
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "request_id"
          properties:
            code:
              type: "string"
              enum:
                - "unauthenticated"
                - "signature_required"
                - "invalid_signature"
                - "ip_not_allowed"
                - "https_required"
                - "forbidden_ability"
                - "not_found"
                - "method_not_allowed"
                - "validation_failed"
                - "idempotency_key_reused"
                - "snapshot_mismatch"
                - "payload_too_large"
                - "unsupported_media_type"
                - "rate_limited"
                - "integration_disabled"
                - "internal_error"
                - "http_error"
            message:
              type: "string"
            fields:
              type: "object"
              additionalProperties:
                type: "array"
                items:
                  type: "string"
              description: "Field => list of error codes (required, invalid_guid, invalid_datetime, invalid_enum, must_be_array, too_many_records, ...)."
            rejected:
              type: "array"
              items:
                "$ref": "#/components/schemas/RejectedRecord"
            request_id:
              type: "string"
              format: "uuid"
    Ping:
      type: "object"
      properties:
        status:
          type: "string"
          const: "ok"
        api_version:
          type: "string"
        server_time:
          type: "string"
          format: "date-time"
        token:
          type: "object"
          properties:
            name:
              type: "string"
            abilities:
              type: "array"
              items:
                type: "string"
            expires_at:
              type: "string"
              format: "date-time"
        integration_enabled:
          type: "boolean"
        request_id:
          type: "string"
          format: "uuid"
    Envelope:
      type: "object"
      required:
        - "batch_id"
        - "mode"
        - "sent_at"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
          description: "New UUID per batch; reuse it only to retry the same body."
        mode:
          type: "string"
          enum:
            - "delta"
            - "full"
        sent_at:
          type: "string"
          description: "ISO 8601; without offset = Asia/Tashkent"
          examples:
            - "2026-10-19T09:30:00+05:00"
        source:
          type: "object"
          description: "Free information about the sender (base name, user, version)."
          additionalProperties: true
        snapshot:
          "$ref": "#/components/schemas/Snapshot"
    Snapshot:
      type: "object"
      description: "Required for mode=full. All parts of one snapshot use the same id and total_parts."
      required:
        - "id"
        - "part"
        - "total_parts"
      properties:
        id:
          type: "string"
          format: "uuid"
        part:
          type: "integer"
          minimum: 1
        total_parts:
          type: "integer"
          minimum: 1
          maximum: 10000
        scope:
          type: "object"
          properties:
            warehouse_ids:
              type: "array"
              items:
                type: "string"
                format: "uuid"
                description: "1C reference GUID"
              description: "Stock snapshot limited to these warehouses."
    Unit:
      type: "object"
      required:
        - "id"
        - "is_deleted"
        - "updated_at"
        - "code"
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        is_deleted:
          type: "boolean"
          description: "Marked for deletion in 1C: the CRM deactivates the record (never deletes it)."
        updated_at:
          type: "string"
          description: "Last change in 1C; an older value never overwrites a newer one (stale)."
          examples:
            - "2026-10-19T09:30:00+05:00"
        version:
          type: "string"
          maxLength: 64
          description: "1C data version (optional)."
        code:
          type: "string"
          maxLength: 16
          description: "OKEI code (796 = pcs, 166 = kg, 006 = m, ...). The quantity precision of a new unit is set in the CRM."
        name:
          type: "string"
          maxLength: 64
    Group:
      type: "object"
      required:
        - "id"
        - "is_deleted"
        - "updated_at"
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        is_deleted:
          type: "boolean"
          description: "Marked for deletion in 1C: the CRM deactivates the record (never deletes it)."
        updated_at:
          type: "string"
          description: "Last change in 1C; an older value never overwrites a newer one (stale)."
          examples:
            - "2026-10-19T09:30:00+05:00"
        version:
          type: "string"
          maxLength: 64
          description: "1C data version (optional)."
        code:
          type: "string"
          maxLength: 50
        name:
          type: "string"
          maxLength: 120
        parent_id:
          type:
            - "string"
            - "null"
          format: "uuid"
    Item:
      type: "object"
      required:
        - "id"
        - "is_deleted"
        - "updated_at"
        - "code"
        - "name"
        - "type"
        - "unit_id"
        - "vat_rate"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        is_deleted:
          type: "boolean"
          description: "Marked for deletion in 1C: the CRM deactivates the record (never deletes it)."
        updated_at:
          type: "string"
          description: "Last change in 1C; an older value never overwrites a newer one (stale)."
          examples:
            - "2026-10-19T09:30:00+05:00"
        version:
          type: "string"
          maxLength: 64
          description: "1C data version (optional)."
        code:
          type: "string"
          maxLength: 64
          description: "1C code; shown as SKU in the CRM."
        article:
          type:
            - "string"
            - "null"
          maxLength: 64
        name:
          type: "string"
          maxLength: 255
        description:
          type:
            - "string"
            - "null"
        type:
          type: "string"
          enum:
            - "product"
            - "service"
        group_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        unit_id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        vat_rate:
          type: "string"
          description: "Percent (\"12\", \"0\") or \"exempt\". Stored as basis points (12 % = 1200)."
          examples:
            - "12"
        accountant_code:
          type:
            - "string"
            - "null"
          maxLength: 64
        class_code:
          type:
            - "string"
            - "null"
          pattern: "^\\d{1,17}$"
          description: "IKPU (MXIK) code, normally 17 digits."
        package_code:
          type:
            - "string"
            - "null"
          pattern: "^\\d{1,32}$"
        is_serialized:
          type:
            - "boolean"
            - "null"
          description: "Serial numbers are then tracked in the CRM (CRM-owned registry)."
        sale_price:
          type:
            - "string"
            - "null"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Absent = keep, null = clear."
          examples:
            - "1500000.00"
        sale_currency:
          type: "string"
          enum:
            - "UZS"
            - "USD"
            - "EUR"
            - "RUB"
        purchase_price:
          type:
            - "string"
            - "null"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Absent = keep, null = clear."
          examples:
            - "1500000.00"
        purchase_currency:
          type: "string"
          enum:
            - "UZS"
            - "USD"
            - "EUR"
            - "RUB"
        prices_include_vat:
          type:
            - "boolean"
            - "null"
    Warehouse:
      type: "object"
      required:
        - "id"
        - "is_deleted"
        - "updated_at"
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        is_deleted:
          type: "boolean"
          description: "Marked for deletion in 1C: the CRM deactivates the record (never deletes it)."
        updated_at:
          type: "string"
          description: "Last change in 1C; an older value never overwrites a newer one (stale)."
          examples:
            - "2026-10-19T09:30:00+05:00"
        version:
          type: "string"
          maxLength: 64
          description: "1C data version (optional)."
        code:
          type: "string"
          maxLength: 50
        name:
          type: "string"
          maxLength: 255
    StockRow:
      type: "object"
      required:
        - "item_id"
        - "warehouse_id"
        - "quantity"
      properties:
        item_id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        warehouse_id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        quantity:
          type: "string"
          pattern: "^-?\\d{1,12}(\\.\\d{1,3})?$"
          examples:
            - "12.000"
        reserved:
          type: "string"
          pattern: "^-?\\d{1,12}(\\.\\d{1,3})?$"
          examples:
            - "12.000"
          description: "Reserved in 1C (not negative)."
        cost:
          type: "string"
          pattern: "^-?\\d{1,15}(\\.\\d{1,6})?$"
          description: "Total cost of `quantity` (preferred)."
          examples:
            - "1500000.00"
        unit_cost:
          type: "string"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Cost per unit, used when `cost` is absent."
          examples:
            - "1500000.00"
        cost_currency:
          type: "string"
          enum:
            - "UZS"
            - "USD"
            - "EUR"
            - "RUB"
    ItemsBatch:
      allOf:
        - "$ref": "#/components/schemas/Envelope"
        - type: "object"
          properties:
            units:
              type: "array"
              items:
                "$ref": "#/components/schemas/Unit"
            groups:
              type: "array"
              items:
                "$ref": "#/components/schemas/Group"
            items:
              type: "array"
              items:
                "$ref": "#/components/schemas/Item"
    StockBatch:
      allOf:
        - "$ref": "#/components/schemas/Envelope"
        - type: "object"
          required:
            - "as_of"
          properties:
            as_of:
              type: "string"
              description: "ISO 8601; without offset = Asia/Tashkent"
              examples:
                - "2026-10-19T09:30:00+05:00"
            warehouses:
              type: "array"
              items:
                "$ref": "#/components/schemas/Warehouse"
            stock:
              type: "array"
              items:
                "$ref": "#/components/schemas/StockRow"
    CombinedBatch:
      allOf:
        - "$ref": "#/components/schemas/Envelope"
        - type: "object"
          properties:
            items:
              type: "object"
              properties:
                units:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Unit"
                groups:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Group"
                items:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Item"
            stock:
              type: "object"
              required:
                - "as_of"
              properties:
                as_of:
                  type: "string"
                  description: "ISO 8601; without offset = Asia/Tashkent"
                  examples:
                    - "2026-10-19T09:30:00+05:00"
                warehouses:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Warehouse"
                stock:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/StockRow"
    RejectedRecord:
      type: "object"
      properties:
        section:
          type: "string"
          enum:
            - "units"
            - "groups"
            - "items"
            - "warehouses"
            - "stock"
        index:
          type: "integer"
        id:
          type:
            - "string"
            - "null"
        errors:
          type: "array"
          items:
            type: "object"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
    BatchAccepted:
      type: "object"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          const: "queued"
        received:
          type: "object"
          additionalProperties:
            type: "integer"
        accepted:
          type: "integer"
        rejected:
          type: "array"
          items:
            "$ref": "#/components/schemas/RejectedRecord"
        status_url:
          type: "string"
        request_id:
          type: "string"
          format: "uuid"
    BatchStatus:
      type: "object"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum:
            - "received"
            - "queued"
            - "processing"
            - "processed"
            - "partial"
            - "failed"
            - "rejected"
        mode:
          type:
            - "string"
            - "null"
          enum:
            - "delta"
            - "full"
            - null
        endpoint:
          type: "string"
        received_at:
          type: "string"
          format: "date-time"
        processed_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        counts:
          type: "object"
          description: "created, updated, unchanged, stale, deactivated, failed"
          additionalProperties:
            type: "integer"
        rejected:
          type: "array"
          items:
            "$ref": "#/components/schemas/RejectedRecord"
        errors:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
        snapshot:
          type:
            - "object"
            - "null"
          properties:
            id:
              type: "string"
            part:
              type: "integer"
            total_parts:
              type: "integer"
        request_id:
          type: "string"
          format: "uuid"
    CustomerContact:
      type: "object"
      properties:
        crm_id:
          type: "string"
          format: "uuid"
        external_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        first_name:
          type: "string"
        last_name:
          type:
            - "string"
            - "null"
        position:
          type:
            - "string"
            - "null"
        phone:
          type:
            - "string"
            - "null"
        email:
          type:
            - "string"
            - "null"
        is_primary:
          type: "boolean"
        is_deleted:
          type: "boolean"
    CustomerOutboxEntry:
      type: "object"
      properties:
        outbox_id:
          type: "integer"
        queued_at:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
          enum:
            - "created"
            - "updated"
            - "contacts"
            - "resync"
        delivery_count:
          type: "integer"
        crm_id:
          type: "string"
          format: "uuid"
          description: "CRM organization UUID; send it back in the ack."
        external_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        external_version:
          type:
            - "string"
            - "null"
        legal_type:
          type: "string"
          enum:
            - "legal_entity"
            - "sole_proprietor"
        name:
          type: "string"
        full_name:
          type:
            - "string"
            - "null"
        tax_id:
          type:
            - "string"
            - "null"
        country:
          type: "string"
          description: "ISO 3166-1 alpha-2"
        city:
          type:
            - "string"
            - "null"
        address:
          type:
            - "string"
            - "null"
        postal_code:
          type:
            - "string"
            - "null"
        phone:
          type:
            - "string"
            - "null"
        email:
          type:
            - "string"
            - "null"
        contacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/CustomerContact"
    CustomersPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/CustomerOutboxEntry"
        next_cursor:
          type: "string"
        has_more:
          type: "boolean"
        server_time:
          type: "string"
          format: "date-time"
        request_id:
          type: "string"
          format: "uuid"
    CustomerAck:
      type: "object"
      required:
        - "crm_id"
        - "status"
      properties:
        crm_id:
          type: "string"
          format: "uuid"
        outbox_id:
          type:
            - "integer"
            - "null"
          description: "Recommended; without it the latest open entry is acknowledged."
        status:
          type: "string"
          enum:
            - "synced"
            - "failed"
        external_id:
          type: "string"
          format: "uuid"
          description: "Required for synced: the 1C GUID of the counterparty."
        external_code:
          type: "string"
          maxLength: 50
        external_version:
          type: "string"
          maxLength: 64
        contacts:
          type: "array"
          items:
            type: "object"
            properties:
              crm_id:
                type: "string"
                format: "uuid"
              external_id:
                type: "string"
                format: "uuid"
                description: "1C reference GUID"
        error:
          type: "object"
          description: "For failed: shown to CRM users."
          properties:
            code:
              type: "string"
            message:
              type: "string"
            fields:
              type: "array"
              items:
                type: "string"
    CustomerAcks:
      oneOf:
        - "$ref": "#/components/schemas/CustomerAck"
        - type: "object"
          required:
            - "acks"
          properties:
            acks:
              type: "array"
              minItems: 1
              maxItems: 500
              items:
                "$ref": "#/components/schemas/CustomerAck"
    AckResults:
      type: "object"
      properties:
        results:
          type: "array"
          items:
            type: "object"
            properties:
              index:
                type: "integer"
              crm_id:
                type:
                  - "string"
                  - "null"
              outbox_id:
                type:
                  - "integer"
                  - "null"
              event_id:
                type:
                  - "string"
                  - "null"
              result:
                type: "string"
                enum:
                  - "applied"
                  - "already_applied"
                  - "superseded"
                  - "rejected"
              errors:
                type: "array"
                items:
                  type: "object"
                  properties:
                    field:
                      type:
                        - "string"
                        - "null"
                    code:
                      type: "string"
                      description: "validation_failed, unknown_crm_id, unknown_outbox_id, nothing_pending, already_acknowledged, external_id_taken, unknown_event_id, feed_not_allowed"
        request_id:
          type: "string"
          format: "uuid"
    CustomerInbound:
      type: "object"
      required:
        - "id"
        - "name"
        - "legal_type"
        - "is_deleted"
        - "updated_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        is_deleted:
          type: "boolean"
          description: "Marked for deletion in 1C: the CRM deactivates the record (never deletes it)."
        updated_at:
          type: "string"
          description: "Last change in 1C; an older value never overwrites a newer one (stale)."
          examples:
            - "2026-10-19T09:30:00+05:00"
        version:
          type: "string"
          maxLength: 64
          description: "1C data version (optional)."
        code:
          type: "string"
          maxLength: 50
        crm_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "Set when 1C created the counterparty from a CRM customer it pulled."
        legal_type:
          type: "string"
          enum:
            - "legal_entity"
            - "sole_proprietor"
            - "individual"
          description: "`individual` is skipped."
        name:
          type: "string"
          maxLength: 255
        full_name:
          type:
            - "string"
            - "null"
        tax_id:
          type:
            - "string"
            - "null"
          maxLength: 32
        country:
          type:
            - "string"
            - "null"
        city:
          type:
            - "string"
            - "null"
        address:
          type:
            - "string"
            - "null"
        postal_code:
          type:
            - "string"
            - "null"
        phone:
          type:
            - "string"
            - "null"
        email:
          type:
            - "string"
            - "null"
        manager:
          type: "object"
