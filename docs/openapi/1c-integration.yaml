                  - null
              note:
                type:
                  - "string"
                  - "null"
              serials:
                type:
                  - "array"
                  - "null"
                items:
                  type: "string"
                description: "Only for customer returns, or when enabled in the CRM."
              damaged_serials:
                type:
                  - "array"
                  - "null"
                items:
                  type: "string"
                description: "Serials flagged damaged (when serials are sent)."
    PowerOfAttorney:
      type: "object"
      description: "Power of attorney checkbox of the order (Spec 06 section 28): required for B2B legal entities by default; the tax invoice (счёт-фактура) is registered only after it is received or overridden."
      properties:
        required:
          type: "boolean"
        received:
          type: "boolean"
        received_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        note:
          type:
            - "string"
            - "null"
          description: "Free text, e.g. number, date and representative."
        overridden:
          type: "boolean"
    StockAdjustmentPayload:
      type: "object"
      description: "Stock adjustment posted in the CRM (Spec 06 section 21.4): found serials, a serial replaced on a posted delivery note, or a quantity correction. 1C stays the quantity truth."
      properties:
        number:
          type: "string"
        date:
          type:
            - "string"
            - "null"
          format: "date"
        type:
          type: "string"
          enum:
            - "found"
            - "serial_correction"
            - "qty_correction"
        reason:
          type: "string"
        warehouse_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        delivery:
          type:
            - "object"
            - "null"
          properties:
            crm_id:
              type: "string"
              format: "uuid"
            number:
              type: "string"
        lines:
          type: "array"
          items:
            type: "object"
            properties:
              item_id:
                type:
                  - "string"
                  - "null"
                format: "uuid"
              accountant_code:
                type:
                  - "string"
                  - "null"
              quantity:
                type: "string"
                description: "Signed for quantity corrections."
              serial:
                type:
                  - "string"
                  - "null"
              old_serial:
                type:
                  - "string"
                  - "null"
              old_serial_outcome:
                type:
                  - "string"
                  - "null"
                enum:
                  - "available"
                  - "quarantined"
                  - null
    StockOffPayload:
      type: "object"
      description: "Stock write-off / damage act posted in the CRM (Spec 06 section 27): write the quantities off in 1C. 1C stays the quantity truth."
      properties:
        number:
          type: "string"
        date:
          type:
            - "string"
            - "null"
          format: "date"
        reason:
          type: "string"
          enum:
            - "damaged_at_receipt"
            - "damaged_in_storage"
            - "damaged_in_transit"
            - "lost"
            - "theft"
            - "expired"
            - "quality_rejection"
            - "internal_use"
            - "sample"
            - "return_rejected"
            - "other"
        note:
          type:
            - "string"
            - "null"
        warehouse_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        goods_receipt:
          type:
            - "object"
            - "null"
          properties:
            crm_id:
              type: "string"
              format: "uuid"
            number:
              type: "string"
            onec_document_id:
              type:
                - "string"
                - "null"
              format: "uuid"
        supplier_tax_id:
          type:
            - "string"
            - "null"
        claim:
          type:
            - "object"
            - "null"
          properties:
            status:
              type: "string"
              enum:
                - "open"
                - "settled"
                - "rejected"
            reference:
              type:
                - "string"
                - "null"
        totals:
          type: "object"
          additionalProperties:
            type: "string"
            pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
            description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
            examples:
              - "1500000.00"
          description: "Estimated value per currency (from the stock cost)."
        lines:
          type: "array"
          items:
            type: "object"
            properties:
              item_id:
                type:
                  - "string"
                  - "null"
                format: "uuid"
              accountant_code:
                type:
                  - "string"
                  - "null"
              quantity:
                type: "string"
                pattern: "^-?\\d{1,12}(\\.\\d{1,3})?$"
                examples:
                  - "12.000"
              value:
                type:
                  - "string"
                  - "null"
                pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
                description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
                examples:
                  - "1500000.00"
              currency:
                type:
                  - "string"
                  - "null"
              serials:
                type:
                  - "array"
                  - "null"
                items:
                  type: "string"
                description: "Only when enabled in the CRM."
    GoodsReceiptInbound:
      type: "object"
      required:
        - "id"
        - "number"
        - "date"
        - "warehouse_id"
        - "supplier"
        - "lines"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C document GUID (echoed back)."
        crm_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "CRM id from an earlier answer; matched first."
        version:
          type:
            - "integer"
            - "null"
          minimum: 1
          description: "CRM version from the last answer; an older one is `stale_version`."
        updated_at:
          type: "string"
          description: "When the document changed in 1C; older than the stored one is `stale_update`."
          examples:
            - "2026-10-19T09:30:00+05:00"
        number:
          type: "string"
          maxLength: 50
        date:
          type: "string"
          format: "date"
        warehouse_id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        supplier:
          type: "object"
          required:
            - "tax_id"
          properties:
            tax_id:
              type: "string"
              maxLength: 32
            name:
              type: "string"
            full_name:
              type:
                - "string"
                - "null"
            country:
              type:
                - "string"
                - "null"
              description: "ISO 3166-1 alpha-2"
        lines:
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            type: "object"
            required:
              - "line_id"
              - "item"
              - "expected_qty"
            properties:
              line_id:
                type: "string"
                format: "uuid"
                description: "1C line id (row key), unique in the document."
              item:
                type: "object"
                required:
                  - "id"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "1C reference GUID"
                  code:
                    type: "string"
                    maxLength: 64
                  name:
                    type: "string"
                  unit_id:
                    type: "string"
                    format: "uuid"
                    description: "1C reference GUID"
                description: "`code`, `name`, `unit_id` are needed only when the item is not in the CRM yet."
              expected_qty:
                type: "string"
                pattern: "^-?\\d{1,12}(\\.\\d{1,3})?$"
                examples:
                  - "12.000"
                description: "Quantity on the 1C document (> 0)."
        is_deleted:
          type: "boolean"
          default: false
          description: "Deleted/cancelled in 1C."
    GoodsReceiptsPush:
      type: "object"
      required:
        - "batch_id"
        - "sent_at"
        - "receipts"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        sent_at:
          type: "string"
          description: "ISO 8601; without offset = Asia/Tashkent"
          examples:
            - "2026-10-19T09:30:00+05:00"
        receipts:
          type: "array"
          minItems: 1
          maxItems: 50
          items:
            "$ref": "#/components/schemas/GoodsReceiptInbound"
    GoodsReceiptResult:
      type: "object"
      properties:
        id:
          type:
            - "string"
            - "null"
          description: "Your 1C id, echoed."
        crm_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        number:
          type:
            - "string"
            - "null"
          description: "CRM number (GR-YYYY-NNNNN)."
        version:
          type:
            - "integer"
            - "null"
        result:
          type: "string"
          enum:
            - "created"
            - "updated"
            - "unchanged"
            - "cancelled"
            - "cancel_requested"
            - "failed"
        review_flagged:
          type: "boolean"
        created:
          type: "object"
          description: "What the push created in the CRM."
          properties:
            partner:
              type: "boolean"
            items:
              type: "array"
              items:
                type: "string"
        errors:
          type: "array"
          items:
            type: "object"
            properties:
              field:
                type:
                  - "string"
                  - "null"
              code:
                type: "string"
    GoodsReceiptsPushResult:
      type: "object"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        results:
          type: "array"
          items:
            allOf:
              - "$ref": "#/components/schemas/GoodsReceiptResult"
              - type: "object"
                properties:
                  index:
                    type: "integer"
        request_id:
          type: "string"
          format: "uuid"
    GoodsReceiptUpdateResult:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/GoodsReceiptResult"
        request_id:
          type: "string"
          format: "uuid"
    ServiceTicketPayload:
      type: "object"
      description: "Billable repair closed outside warranty (Spec 09 §10): create a sales document for the service work in 1C."
      properties:
        number:
          type: "string"
        date:
          type:
            - "string"
            - "null"
          format: "date"
        customer:
          type: "object"
          properties:
            crm_id:
              type:
                - "string"
                - "null"
              format: "uuid"
            external_id:
              type:
                - "string"
                - "null"
              format: "uuid"
        currency:
          type: "string"
          enum:
            - "UZS"
            - "USD"
            - "EUR"
            - "RUB"
        asset:
          type: "object"
          properties:
            item_id:
              type:
                - "string"
                - "null"
              format: "uuid"
            name:
              type: "string"
            serial:
              type: "string"
        under_warranty:
          type: "boolean"
          const: false
        parts:
          type: "array"
          items:
            type: "object"
            properties:
              item_id:
                type:
                  - "string"
                  - "null"
                format: "uuid"
              description:
                type: "string"
              quantity:
                type: "string"
                pattern: "^-?\\d{1,12}(\\.\\d{1,3})?$"
                examples:
                  - "12.000"
              unit_price:
                type: "string"
                pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
                description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
                examples:
                  - "1500000.00"
              total:
                type: "string"
                pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
                description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
                examples:
                  - "1500000.00"
        labor:
          type: "string"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
          examples:
            - "1500000.00"
        total:
          type: "string"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
          examples:
            - "1500000.00"
        resolution:
          type:
            - "string"
            - "null"
    OutboxAck:
      type: "object"
      required:
        - "event_id"
        - "result"
      properties:
        event_id:
          type: "string"
          format: "uuid"
        result:
          type: "string"
          enum:
            - "applied"
            - "already_applied"
            - "superseded"
            - "rejected"
        onec_guid:
          type: "string"
          format: "uuid"
          description: "GUID of the 1C document created."
        onec_number:
          type: "string"
          maxLength: 40
        posting_status:
          type: "string"
          enum:
            - "posted"
            - "unposted"
            - "deleted"
        updated_at:
          type: "string"
          description: "ISO 8601; without offset = Asia/Tashkent"
          examples:
            - "2026-10-19T09:30:00+05:00"
        errors:
          type: "array"
          items:
            type: "object"
            properties:
              code:
                type: "string"
              message:
                type: "string"
          description: "For rejected."
    OutboxAcks:
      type: "object"
      required:
        - "acks"
      properties:
        acks:
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            "$ref": "#/components/schemas/OutboxAck"
    PaymentInbound:
      type: "object"
      required:
        - "id"
        - "amount"
        - "currency"
        - "paid_on"
        - "updated_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "1C reference GUID"
        crm_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "For payments the CRM recorded and 1C booked."
        number:
          type: "string"
          maxLength: 40
        version:
          type: "string"
        posted:
          type: "boolean"
          default: true
        direction:
          type: "string"
          enum:
            - "incoming"
            - "outgoing"
          default: "incoming"
        kind:
          type: "string"
          enum:
            - "receipt"
            - "refund"
          default: "receipt"
        method:
          type: "string"
          enum:
            - "bank_transfer"
            - "cash"
            - "card"
          default: "bank_transfer"
        customer_id:
          type:
            - "string"
            - "null"
          format: "uuid"
          description: "1C GUID of the customer."
        customer_crm_id:
          type:
            - "string"
            - "null"
          format: "uuid"
        amount:
          type: "string"
          pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
          description: "Positive amount in major units."
          examples:
            - "1500000.00"
        currency:
          type: "string"
          enum:
            - "UZS"
            - "USD"
            - "EUR"
            - "RUB"
        paid_on:
          type: "string"
          format: "date"
        payer_name:
          type:
            - "string"
            - "null"
        payer_tax_id:
          type:
            - "string"
            - "null"
        reference_number:
          type:
            - "string"
            - "null"
        purpose:
          type:
            - "string"
            - "null"
        is_deleted:
          type: "boolean"
          description: "Deleted in 1C: the CRM payment is voided."
        updated_at:
          type: "string"
          description: "ISO 8601; without offset = Asia/Tashkent"
          examples:
            - "2026-10-19T09:30:00+05:00"
        allocations:
          type: "array"
          items:
            type: "object"
            properties:
              order_crm_id:
                type: "string"
                format: "uuid"
              amount:
                type: "string"
                pattern: "^\\d{1,15}(\\.\\d{1,6})?$"
                description: "Decimal in major units; rounded half-up to the currency precision (UZS/USD/EUR/RUB: 2)."
                examples:
                  - "1500000.00"
    PaymentsPush:
      type: "object"
      required:
        - "batch_id"
        - "sent_at"
        - "payments"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        sent_at:
          type: "string"
          description: "ISO 8601; without offset = Asia/Tashkent"
          examples:
            - "2026-10-19T09:30:00+05:00"
        payments:
          type: "array"
          minItems: 1
          maxItems: 1000
          items:
            "$ref": "#/components/schemas/PaymentInbound"
    PaymentsPushResult:
      type: "object"
      properties:
        batch_id:
          type: "string"
          format: "uuid"
        results:
          type: "array"
          items:
            type: "object"
            properties:
              index:
                type: "integer"
              id:
                type:
                  - "string"
                  - "null"
              crm_id:
                type:
                  - "string"
                  - "null"
              result:
                type: "string"
                enum:
                  - "created"
                  - "unmatched"
                  - "possible_duplicate"
                  - "updated"
                  - "corrected"
                  - "unchanged"
                  - "voided"
                  - "failed"
              errors:
                type: "array"
                items:
                  type: "object"
        request_id:
          type: "string"
          format: "uuid"
