  "/customers/pending":
    get:
      tags:
        - "Customers"
      operationId: "pullCustomers"
      summary: "Customers created or changed in the CRM, to create or update in 1C"
      description: "Ability `customers:read`. Oldest first; pass `next_cursor` as `cursor` for the next page until `has_more` is false. Entries stay pending until acknowledged, so a lost response is simply pulled again (`delivery_count` grows). Only partners with \"Sync with 1C\" on and a tax ID are listed (rev. 4); the switch is off by default for new partners."
      parameters:
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 500
            default: 100
        - name: "cursor"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d*$"
            default: "0"
          description: "Opaque; the `next_cursor` of the previous page."
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Timestamp"
        - "$ref": "#/components/parameters/Signature"
      responses:
        "200":
          description: "A page of customers"
          content:
