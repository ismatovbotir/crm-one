  "/outbox/pending":
    get:
      tags:
        - "Document outbox (pull)"
      operationId: "pullOutbox"
      summary: "Pull CRM documents of one feed"
      description: |-
        Feed abilities: `orders` → `orders:read`, `payments` → `payments:read`, `warehouse` → `warehouse:read`. Events are ordered by `sequence`; for one document a later event is held back until the earlier one is acknowledged (head-of-line), and order-feed events of a customer that has no 1C GUID yet are held until the customer is acknowledged. Pulled events stay open until acknowledged.

        Event types: `order.confirmed`, `order.amended` (lines, discounts or quantities changed after the order started; the whole order is resent, `revision` rises), `order.cancelled`, `order.closed`, `invoice.issued`, `invoice.registered`, `invoice.voided`, `agreement.signed`, `agreement.terminated`, `delivery.posted`, `service_ticket.closed` (billable repair outside warranty, Spec 09) (feed `orders`); `payment.recorded`, `payment.refund_recorded`, `payment.voided` (feed `payments`); `goods_receipt.posted`, `goods_receipt.cancelled` (a 1C receipt cancelled in the CRM), `stock_off.posted` (stock write-off / damage act), `stock_adjustment.posted` (found serials, serial or quantity correction) (feed `warehouse`).
      parameters:
        - name: "feed"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "orders"
              - "payments"
              - "warehouse"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 500
            default: 200
        - name: "cursor"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d*$"
            default: "0"
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Timestamp"
        - "$ref": "#/components/parameters/Signature"
      responses:
        "200":
          description: "A page of events"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OutboxPage"
              examples:
                orders:
                  value:
                    data:
                      - sequence: 1201
                        event_id: "b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e"
                        event_type: "delivery.posted"
                        occurred_at: "2026-10-19T11:02:00+05:00"
                        aggregate:
